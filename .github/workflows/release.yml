name: Build and Release
on:
  push:
    branches: [main]
    paths:
      - 'DeckyDiskDoctor/**'
      - 'src/**'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - 'plugin.json'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: disk-doctor-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and verify version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./plugin.json').version")"
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::package.json and plugin.json versions do not match"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install and build frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Validate and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -m py_compile DeckyDiskDoctor/main.py
          test -s dist/index.js
          node --check dist/index.js
          python3 -m json.tool plugin.json > /dev/null
          rm -rf out
          mkdir -p out/DeckyDiskDoctor/dist
          cp DeckyDiskDoctor/main.py plugin.json package.json out/DeckyDiskDoctor/
          cp dist/index.js out/DeckyDiskDoctor/dist/index.js
          cp README.md out/DeckyDiskDoctor/
          (cd out && zip -qr "Decky-Disk-Doctor-v${VERSION}.zip" DeckyDiskDoctor)
          unzip -t "out/Decky-Disk-Doctor-v${VERSION}.zip"
      - name: Publish or replace release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ZIP="out/Decky-Disk-Doctor-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Decky Disk Doctor $TAG" \
              --generate-notes \
              --prerelease
          fi
